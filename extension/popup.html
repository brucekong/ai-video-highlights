<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Video Helper</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #0D0D10;
      color: #fff;
    }
    .header {
      padding: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h2 {
      margin: 0;
      font-size: 1.2rem;
      background: linear-gradient(to right, #F0F0F0, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
    }
    .main {
      padding: 20px 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #A1A1AA;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>AI Video Helper</h2>
    <div class="status">
      <div class="status-dot"></div>
      插件运行正常
    </div>
  </div>
  <div class="main">
    <p>该插件在后台静默运行，正在为你的 Web 客户端提供安全的防风控访问能力。</p>
    <p>您可以在 Web 页面直接解析视频，无需在此处操作。</p>
  </div>
</body>
</html>
