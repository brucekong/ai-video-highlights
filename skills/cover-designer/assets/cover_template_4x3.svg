<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080">
  <defs>
    <!-- Soft Top Gradient Dimmer for High Contrast -->
    <linearGradient id="topDimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Pop Drop Shadow -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Subtle Text Gradient Fill -->
    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
  </defs>

  <style>
    .title-cn {
      font-family: "PingFang SC", "Hiragino Sans GB", "Yuanti SC", "Rounded Mplus 1c", "Comic Sans MS", sans-serif;
      font-weight: 900;
      font-size: 104px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .title-en {
      font-family: "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .outer-stroke {
      stroke: #3E1602;
      stroke-width: 22px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .inner-fill {
      fill: url(#textGradient);
    }
    .en-stroke {
      stroke: #2E1200;
      stroke-width: 8px;
      stroke-linejoin: round;
    }
    .en-fill {
      fill: #FFF8E7;
    }
  </style>

  <!-- Background Dimmer (Active in top 280px) -->
  <rect x="0" y="0" width="1440" height="320" fill="url(#topDimmer)" />

  <!-- Top Text Group (Filtered with 3D Pop Shadow) -->
  <g filter="url(#popShadow)">
    <!-- Chinese Main Title: Outer Stroke then Fill -->
    <text x="720" y="130" class="title-cn outer-stroke">精选高光时刻</text>
    <text x="720" y="130" class="title-cn inner-fill">精选高光时刻</text>

    <!-- English Subtitle: Harmonious Proportion Below Chinese Title -->
    <text x="720" y="215" class="title-en en-stroke">BEST MOMENTS HIGHLIGHT</text>
    <text x="720" y="215" class="title-en en-fill">BEST MOMENTS HIGHLIGHT</text>
  </g>
</svg>
